<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
      .c {
        background-color: orange;
        width: 100px;
        height: 100px;
      }
    </style>
  </head>
  <body>
    <div id="b1">Menu</div>
    <div id="box" class="c"></div>
    <script>
      $("#b1").on("mouseover", function () {
        $("#box").slideDown(100);
      });
       $("#b1").on("mouseleave", function () {
        $("#box").slideUp(100);
      });
    </script>
  </body>
</html>
